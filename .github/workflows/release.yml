name: Release

# Push a tag like v0.1.1 -> this builds deal_finder.zip with that version,
# creates a draft release, attaches the zip and then publishes it.
# (Draft first, because immutable releases don't accept assets after publishing.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build zip
        run: python scripts/build.py --version "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
      - name: Create release with zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/deal_finder.zip \
            --draft --title "Deal Finder ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
